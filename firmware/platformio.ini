; ==========================================================
; LatheVision - firmware da ESP32-C3 Mini
; Abra a pasta "firmware" no VS Code com a extensão PlatformIO IDE.
; ==========================================================

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1    ; perfil compatível com a ESP32-C3 Mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800         ; se o upload falhar, tente 115200

; Faz o Monitor Serial funcionar pela própria porta USB da placa
; (sem ela, nada aparece no monitor ao usar a placa C3).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    knolleary/PubSubClient@^2.8   ; cliente MQTT
